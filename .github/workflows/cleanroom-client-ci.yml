name: Cleanroom Client CI

on:
  push:
    branches:
      - incubator/cleanroom-client
    paths:
      - "cleanroom-client/**"
      - ".github/workflows/cleanroom-client-ci.yml"
  pull_request:
    paths:
      - "cleanroom-client/**"
      - ".github/workflows/cleanroom-client-ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cleanroom-client
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build
        run: gradle --no-daemon clean test jar
      - name: Smoke boot
        run: java -jar build/libs/cleanroom-client-0.0.1-SNAPSHOT.jar
